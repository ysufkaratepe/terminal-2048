name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Derle
        run: |
          cmake -B build
          cmake --build build --config Release
      - name: Testleri çalıştır
        run: ctest --test-dir build -C Release --output-on-failure
